name: Deploy Staging Web

on:
  workflow_dispatch:

concurrency:
  group: staging-web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Workers staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check vinext compatibility
        run: pnpm check:vinext
      - name: Deploy staging Worker
        run: pnpm deploy:cloudflare:staging
