name: One-time Go format

on:
  push:
    branches:
      - applyforge/relevance-sourcing-20260907

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: applyforge/relevance-sourcing-20260907
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Format Go sources
        run: gofmt -w apps/api
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/api; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "applyforge-ci"
          git config user.email "applyforge-ci@users.noreply.github.com"
          git add apps/api
          git commit -m "Apply gofmt to relevance sourcing changes"
          git push origin HEAD:applyforge/relevance-sourcing-20260907
