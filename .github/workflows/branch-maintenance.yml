name: Branch Maintenance

on:
  push:
    branches:
      - applyforge/next-phases-20260907

permissions:
  contents: write

jobs:
  sync-generated-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: applyforge/next-phases-20260907
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Format Go and tidy modules
        working-directory: apps/api
        run: |
          gofmt -w .
          go mod tidy

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate web lockfile
        working-directory: apps/web
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit mechanical updates
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web/pnpm-lock.yaml
          git commit -m "Format code and refresh dependency locks"
          git push origin HEAD:applyforge/next-phases-20260907
