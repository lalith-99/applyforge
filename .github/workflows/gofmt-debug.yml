name: Gofmt Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Show gofmt diff
        run: |
          cd apps/api
          gofmt -d internal/jobs/company_source_inspection_worker.go
          test -z "$(gofmt -l internal/jobs/company_source_inspection_worker.go)"
