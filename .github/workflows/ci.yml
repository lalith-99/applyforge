name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: applyforge
          POSTGRES_PASSWORD: applyforge
          POSTGRES_DB: applyforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U applyforge -d applyforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://applyforge:applyforge@localhost:5432/applyforge?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: Run migrations
        run: goose -dir ../../db/migrations postgres "$DATABASE_URL" up
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...

  python-worker:
    name: Python AI Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest

  web:
    name: Next.js Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  browser-companion:
    name: Browser Companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: Check service worker syntax
        run: node --check background.js
      - name: Check content script syntax
        run: node --check content.js
      - name: Check ATS adapter safety syntax
        run: node --check adapter_safety.js
      - name: Check success signal helper syntax
        run: node --check success_signal.js
      - name: Check final submit safety syntax
        run: node --check final_submit_safety.js
      - name: Check resume upload helper syntax
        run: node --check resume_upload.js
      - name: Test resume upload input scoring
        run: node resume_upload.test.js
      - name: Test field alias safety
        run: node field_alias_safety.test.js
      - name: Test ATS adapter host boundary
        run: node adapter_safety_test.js
      - name: Test ATS success URL boundary
        run: node success_signal.test.js
      - name: Test final submit label safety
        run: node final_submit_safety.test.js

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local stack
        run: docker compose config >/dev/null
