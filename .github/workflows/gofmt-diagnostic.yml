name: Gofmt Diagnostic

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Capture repository formatting state
        run: |
          gofmt -l apps/api > gofmt-files.txt
          cat gofmt-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gofmt-files
          path: gofmt-files.txt
