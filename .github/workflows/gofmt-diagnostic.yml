name: Gofmt Diagnostic

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Format changed Go files
        run: |
          gofmt -w apps/api/internal/jobrecommendations/worker.go apps/api/internal/jobrecommendations/freshness_test.go
      - uses: actions/upload-artifact@v4
        with:
          name: gofmt-output
          path: |
            apps/api/internal/jobrecommendations/worker.go
            apps/api/internal/jobrecommendations/freshness_test.go
