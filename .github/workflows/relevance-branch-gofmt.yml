name: Relevance Branch Gofmt

on:
  push:
    branches:
      - applyforge/relevance-sourcing-20260907

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: applyforge/relevance-sourcing-20260907
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Format Go files
        run: gofmt -w apps/api/internal/jobs/source_health.go apps/api/internal/matching/immigration_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/internal/jobs/source_health.go apps/api/internal/matching/immigration_test.go
          git commit -m "Apply gofmt to sourcing relevance changes"
          git push origin HEAD:applyforge/relevance-sourcing-20260907
